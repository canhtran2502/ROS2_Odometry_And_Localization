  estimate: [0.0, 0.0, 0.0]
  detection: [0.25, 0.25, 0.0]
  expect_accepted: false
  expect: [0.0, 0.0, 0.0]
- name: yaw_wrap_positive
  max_jump: 0.3
  alpha: 0.3
  estimate: [0.0, 0.0, 3.1]
  detection: [0.0, 0.0, -3.1]
  expect_accepted: true
  expect: [0.0, 0.0, 3.124955592153876]
- name: yaw_wrap_negative
  max_jump: 0.3
  alpha: 0.3
  estimate: [0.0, 0.0, -3.1]
  detection: [0.0, 0.0, 3.1]
  expect_accepted: true
  expect: [0.0, 0.0, -3.124955592153876]
- name: yaw_wrap_at_pi
  max_jump: 0.3
  alpha: 0.3
  estimate: [0.0, 0.0, 3.14]
  detection: [0.0, 0.0, -3.14]
  expect_accepted: true
  expect: [0.0, 0.0, 3.140955592153876]
- name: alpha_one_takes_detection
  max_jump: 0.3
  alpha: 1.0
  estimate: [0.0, 0.0, 3.1]
  detection: [0.1, -0.1, -3.1]
  expect_accepted: true
  expect: [0.1, -0.1, -3.1]
- name: alpha_small

filter:
- name: accept_ema
  max_jump: 0.3
  alpha: 0.3
  estimate: [1.0, 2.0, 0.5]
  detection: [1.1, 2.0, 0.7]
  expect_accepted: true
  expect: [1.03, 2.0, 0.56]
- name: reject_nan_x
  max_jump: 0.3
  alpha: 0.3
  estimate: [1.0, 2.0, 0.5]
  detection: [.nan, 2.0, 0.7]
  expect_accepted: false
  expect: [1.0, 2.0, 0.5]
- name: reject_nan_yaw
  max_jump: 0.3
  alpha: 0.3
  estimate: [1.0, 2.0, 0.5]
  detection: [1.0, 2.0, .nan]
  expect_accepted: false
  expect: [1.0, 2.0, 0.5]
- name: reject_inf_y
  max_jump: 0.3
  alpha: 0.3
  estimate: [1.0, 2.0, 0.5]
  detection: [1.0, .inf, 0.5]
  expect_accepted: false
  expect: [1.0, 2.0, 0.5]
- name: reject_jump_far
  max_jump: 0.3
  alpha: 0.3
  estimate: [1.0, 2.0, 0.5]
  detection: [1.5, 2.0, 0.5]
  expect_accepted: false
  expect: [1.0, 2.0, 0.5]
- name: reject_jump_just_over

  detection: [1.0, 1.0, 1.0]
  expect_accepted: true
  expect: [1.0, 1.0, 1.0]
timer:
- name: node_time_expiry
  timeout: 2.0
  clock_stall_timeout: 5.0
  start: [10.0, 100.0]
  events:
  - [10.5, 100.5, false, false]
  - [11.9, 101.0, false, false]
  - [12.0, 101.5, true, false]
  - [13.0, 102.0, true, false]
- name: wall_fallback_when_node_time_stops
  timeout: 100.0
  clock_stall_timeout: 5.0
  start: [0.0, 0.0]
  events:
  - [0.0, 4.0, false, false]
  - [0.0, 5.0, true, true]
  - [0.0, 6.0, true, true]
- name: node_progress_resets_wall_reference
  timeout: 100.0
  clock_stall_timeout: 5.0
  start: [0.0, 0.0]
  events:
  - [1.0, 4.0, false, false]
  - [1.0, 8.0, false, false]
  - [1.0, 9.0, true, true]
- name: fallback_disabled
  timeout: 100.0
  clock_stall_timeout: 0.0
  start: [0.0, 0.0]
  events:
  - [0.0, 1000.0, false, false]
  - [101.0, 1001.0, true, false]
- name: restart_clears_stall
  timeout: 100.0
  clock_stall_timeout: 2.0
  start: [5.0, 50.0]
  events:
  - [5.0, 53.0, true, true]
  restart: [6.0, 60.0]
  events_after:
  - [6.5, 60.5, false, false]
- name: stalled_stays_true_even_if_time_resumes
  timeout: 100.0
  clock_stall_timeout: 2.0
  start: [0.0, 0.0]
  events:
  - [0.0, 3.0, true, true]
  - [0.5, 3.1, true, true]

twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      joystick:
        topic: joy_vel
        timeout: 0.5
        priority: 99
      keyboard:
        topic: key_vel
        timeout: 0.5
        priority: 90
      # Autonomous exploration (frontier_explorer); lowest priority, so the joystick, the
      # keyboard and the safety_stop lock always override it.
      explore:
        topic: explore_vel
        timeout: 0.5
        priority: 10
      # Nav2 navigation (mission_manager missions); above exploration, below the joystick and
      # the keyboard. The safety_stop lock (255) still overrides it. Nothing publishes on
      # nav_vel on the real robot unless navigation.launch.py is started.
      navigation:
        topic: nav_vel
        timeout: 0.5
        priority: 20

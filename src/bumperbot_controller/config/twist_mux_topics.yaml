twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      joystick:
        topic: joy_vel
        timeout: 0.5
        priority: 99
      keyboard:
        topic: key_vel
        timeout: 0.5
        priority: 90
      # Autonomous exploration (frontier_explorer); lowest priority, so the joystick, the
      # keyboard and the safety_stop lock always override it.
      explore:
        topic: explore_vel
        timeout: 0.5
        priority: 10

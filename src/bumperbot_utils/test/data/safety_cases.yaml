        set: {v_odom: 0.0}
        expect: {braking: true, locked: true}
      - t: 0.7
        expect: {braking: false, locked: false, front_zone: STOP, max_forward: 0.0,
                 max_reverse: 0.7, state: ACTIVE}
      - t: 0.8
        set: {v_cmd: 0.3}
        expect: {braking: false, locked: false, max_forward: 0.0}
      - t: 0.9
        set: {v_cmd: -0.1}

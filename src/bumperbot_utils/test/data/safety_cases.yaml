    steps:
      - t: 0.0
        expect: {state: INITIALIZING, locked: true, reason: waiting for scan, max_forward: 0.0,
                 max_reverse: 0.0, front_zone: UNKNOWN, rear_zone: UNKNOWN,
                 estop_latched: false}
      - t: 0.05
        set: {scan_ok: true, scan_age: 0.05, tf_ok: false,
              tf_description: base_footprint <- laser_link}
        expect: {state: INITIALIZING, locked: true,
                 reason: waiting for TF base_footprint <- laser_link}
      - t: 0.10
        set: {tf_ok: true}
        expect: {state: INITIALIZING, locked: true, reason: waiting for odom}
      - t: 0.15
        set: {odom_age: 0.05, v_odom: 0.0}
        expect: {state: ACTIVE, locked: false, reason: "", front_zone: CLEAR, rear_zone: CLEAR,
                 active_zone: CLEAR, max_forward: 0.7, max_reverse: 0.7, braking: false}
